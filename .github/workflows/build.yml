name: Build All Platforms

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 宣告矩陣參數：同時跑 native (Linux) 與 cross-win (Windows 交叉編譯)
    strategy:
      matrix:
        target: [linux, windows]

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        if [ "${{ matrix.target }}" = "windows" ]; then
          sudo apt-get install -y meson ninja-build mingw-w64
        else
          sudo apt-get install -y meson ninja-build
        fi

    - name: Wrap nlohmann
      run: |
        mkdir -p subprojects
        meson wrap install nlohmann_json

    - name: Configure Build
      run: |
        if [ "${{ matrix.target }}" = "windows" ]; then
          # 建立 Windows 交叉編譯檔
          echo "[binaries]" > cross_windows.txt
          echo "c = 'x86_64-w64-mingw32-gcc'" >> cross_windows.txt
          echo "cpp = 'x86_64-w64-mingw32-g++'" >> cross_windows.txt
          echo "ar = 'x86_64-w64-mingw32-ar'" >> cross_windows.txt
          echo "strip = 'x86_64-w64-mingw32-strip'" >> cross_windows.txt
          echo "[host_machine]" >> cross_windows.txt
          echo "system = 'windows'" >> cross_windows.txt
          echo "cpu_family = 'x86_64'" >> cross_windows.txt
          echo "cpu = 'x86_64'" >> cross_windows.txt
          echo "endian = 'little'" >> cross_windows.txt
          
          meson setup build_win --cross-file cross_windows.txt -Denable_debug=true
        else
          meson setup build_linux -Denable_debug=true
        fi

    - name: Compile
      run: |
        if [ "${{ matrix.target }}" = "windows" ]; then
          meson compile -C build_win
        else
          meson compile -C build_linux
        fi

    - name: Run Unit Tests
      if: matrix.target == 'linux'
      run: |
        meson test -C build_linux --verbose

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.target }}
        path: |
          build_linux/hello
          build_win/hello.exe
        if-no-files-found: ignore
